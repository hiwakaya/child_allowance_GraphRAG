<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>児童扶養手当 制度Q&A</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 760px; margin: 0 auto; background: #f7f7f8; color: #1a1a1a;
    box-sizing: border-box; display: flex; flex-direction: column;
    height: 100dvh; padding: 0 16px;
  }
  h1 { font-size: 20px; margin: 20px 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
  .disclaimer { background: #fff8e1; border: 1px solid #f0d68a; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; flex-shrink: 0; }
  #chat { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }
  .msg { border-radius: 10px; padding: 14px 16px; }
  .msg.user { background: #dceeff; align-self: flex-end; max-width: 80%; }
  .msg.bot { background: #fff; border: 1px solid #e2e2e2; }
  .section-label { font-weight: 600; font-size: 12px; color: #555; margin-top: 10px; }
  .section-label:first-child { margin-top: 0; }
  ul { margin: 4px 0 0; padding-left: 20px; }
  li { font-size: 13px; margin-bottom: 4px; line-height: 1.5; }
  .answer { font-size: 15px; line-height: 1.6; }
  form { flex-shrink: 0; background: #f7f7f8; padding: 10px 0 16px; border-top: 1px solid #e2e2e2; }
  .form-row { display: flex; gap: 8px; }
  .compare-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #555; margin-bottom: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: #1a73e8; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #aaa; }
  .loading { color: #888; font-size: 13px; }
  .compare-wrap { display: flex; gap: 12px; flex-wrap: wrap; }
  .compare-col { flex: 1; min-width: 260px; border-radius: 10px; padding: 14px 16px; border: 1px solid #e2e2e2; }
  .compare-col.vector { background: #fafafa; }
  .compare-col.graph { background: #f2f8ff; border-color: #cfe3fb; }
  .compare-title { font-weight: 700; font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .compare-meta { font-weight: 400; color: #888; font-size: 11px; }
  .upload-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #555; }
  .upload-row input[type=file] { font-size: 12px; }
  .file-chip { display: inline-flex; align-items: center; gap: 6px; background: #eef1ee; border-radius: 6px; padding: 3px 8px; }
  .file-chip button { padding: 0 4px; background: none; color: #a33; font-size: 12px; }
  .privacy-note { font-size: 11px; color: #888; }
  .issue-item { font-size: 13px; margin-bottom: 8px; padding: 8px 10px; background: #fff6f2; border-left: 3px solid #c9603f; border-radius: 4px; }
  .issue-item .issue-what { font-weight: 600; }
  .issue-item .issue-ref { color: #888; font-size: 11px; margin-top: 2px; }

  #loginScreen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  #loginScreen p { color: #666; font-size: 13px; max-width: 340px; }
  #loginError { color: #b8382c; font-size: 13px; }
  .app-hidden { display: none !important; }
  .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 12px; font-size: 12px; color: #666; }
  .topbar button { background: none; border: 1px solid #ccc; color: #555; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div id="loginScreen">
    <h1 style="margin:0;">児童扶養手当 制度Q&A</h1>
    <p>このシステムは許可されたGoogleアカウントのみ利用できます。サインインしてください。</p>
    <div id="googleSignInButton"></div>
    <div id="loginError"></div>
  </div>

  <div id="appScreen" class="app-hidden" style="display: contents;">
    <div class="topbar">
      <span id="userEmail"></span>
      <button type="button" id="logoutBtn">ログアウト</button>
    </div>
    <h1>児童扶養手当 制度Q&A</h1>
    <div class="subtitle">札幌市児童扶養手当事務処理マニュアルに基づく制度説明支援（GraphRAG）</div>
    <div class="disclaimer">このシステムは制度の一般的な説明を行うものであり、個別の認定可否や支給額の判断は行いません。実際の手続きは手当給付係にご確認ください。</div>

    <div id="chat"></div>

  <form id="form">
    <label class="compare-toggle">
      <input type="checkbox" id="compareMode">
      比較モード（Vector RAGのみ vs GraphRAG を並べて表示）
    </label>
    <div class="upload-row">
      <label for="pdfFile" style="cursor:pointer;">📎 申請書PDFを添付して不備チェック</label>
      <input type="file" id="pdfFile" accept="application/pdf">
      <span class="privacy-note">（内容は保存・記録されません）</span>
    </div>
    <div id="fileChipRow"></div>
    <div class="form-row">
      <input id="question" type="text" placeholder="例: 事実婚をしている場合、手当は支給されますか　／　PDF添付時は補足メモ（任意）" autocomplete="off">
      <button type="submit" id="submitBtn">質問する</button>
    </div>
  </form>
  </div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('question');
const submitBtn = document.getElementById('submitBtn');
const pdfFile = document.getElementById('pdfFile');
const fileChipRow = document.getElementById('fileChipRow');
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginError = document.getElementById('loginError');
const userEmail = document.getElementById('userEmail');
const OAUTH_CLIENT_ID = '390463753824-jkcfq6j42b3fgqthbi9mm0f0hel2575o.apps.googleusercontent.com';

function showApp(email) {
  loginScreen.classList.add('app-hidden');
  appScreen.classList.remove('app-hidden');
  userEmail.textContent = email;
}

function showLogin(message) {
  appScreen.classList.add('app-hidden');
  loginScreen.classList.remove('app-hidden');
  loginError.textContent = message || '';
}

async function onGoogleCredential(response) {
  loginError.textContent = '';
  try {
    const res = await fetch('/api/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showLogin(err.detail || 'サインインに失敗しました。');
      return;
    }
    const data = await res.json();
    showApp(data.email);
  } catch (err) {
    showLogin('通信エラーが発生しました: ' + err.message);
  }
}

window.addEventListener('load', () => {
  if (!window.google || !window.google.accounts) return;
  google.accounts.id.initialize({ client_id: OAUTH_CLIENT_ID, callback: onGoogleCredential });
  google.accounts.id.renderButton(document.getElementById('googleSignInButton'),
    { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' });
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  showLogin();
});

(async function checkSession() {
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.email) {
      showApp(data.email);
    }
  } catch (err) {
    // stay on login screen
  }
})();

// #chat is its own scroll container (flex:1 1 auto; overflow-y:auto), so the
// bottom of the last message is always above the static form - no fixed
// positioning / dynamic padding sync needed.
function scrollToBottom() {
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

pdfFile.addEventListener('change', () => {
  fileChipRow.innerHTML = '';
  if (pdfFile.files.length === 0) return;
  const chip = document.createElement('span');
  chip.className = 'file-chip';
  chip.innerHTML = `${escapeHtml(pdfFile.files[0].name)} <button type="button" id="removeFile">×</button>`;
  fileChipRow.appendChild(chip);
  document.getElementById('removeFile').addEventListener('click', () => {
    pdfFile.value = '';
    fileChipRow.innerHTML = '';
  });
});

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  chat.appendChild(div);
  scrollToBottom();
}

function listSection(label, items) {
  if (!items || items.length === 0) return '';
  const lis = items.map(i => `<li>${escapeHtml(i)}</li>`).join('');
  return `<div class="section-label">${label}</div><ul>${lis}</ul>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function answerHtml(result) {
  return `
    <div class="answer">${escapeHtml(result.answer || '')}</div>
    <div class="section-label">理由</div>
    <div>${escapeHtml(result.reason || '')}</div>
    ${listSection('根拠', result.evidence)}
    <div class="section-label">推論経路</div>
    <div>${escapeHtml(result.reasoning_path || '（該当なし）')}</div>
    ${listSection('関連法令', result.laws)}
    ${listSection('確認事項', result.confirmations)}
  `;
}

function addBotMessage(result) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = answerHtml(result);
  chat.appendChild(div);
  scrollToBottom();
}

function addComparisonMessage(data) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="compare-wrap">
      <div class="compare-col vector">
        <div class="compare-title">Vector RAGのみ
          <span class="compare-meta">チャンク${data.vector_only.chunk_count}件</span>
        </div>
        ${answerHtml(data.vector_only.result)}
      </div>
      <div class="compare-col graph">
        <div class="compare-title">GraphRAG
          <span class="compare-meta">概念${data.graph_rag.concept_count}件 / チャンク${data.graph_rag.chunk_count}件</span>
        </div>
        ${answerHtml(data.graph_rag.result)}
      </div>
    </div>
  `;
  chat.appendChild(div);
  scrollToBottom();
}

function checkResultHtml(result) {
  const issues = (result.issues || []).map(i => `
    <div class="issue-item">
      <div class="issue-what">${escapeHtml(i.item || '')}: ${escapeHtml(i.issue || '')}</div>
      <div class="issue-ref">${escapeHtml(i.reference || '')}</div>
    </div>
  `).join('') || '<div>指摘事項はありませんでした。</div>';

  return `
    <div class="answer">${escapeHtml(result.summary || '')}</div>
    <div class="section-label">指摘事項</div>
    ${issues}
    ${listSection('不足している可能性のある添付書類', result.missing_attachments)}
    ${listSection('確認事項', result.confirmations)}
  `;
}

function addCheckMessage(result) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = checkResultHtml(result);
  chat.appendChild(div);
  scrollToBottom();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  const hasFile = pdfFile.files.length > 0;
  if (!question && !hasFile) return;

  chat.innerHTML = ''; // new question -> clear the previous answer, don't accumulate history
  addUserMessage(hasFile ? `📎 ${pdfFile.files[0].name}${question ? ' — ' + question : ''}` : question);
  input.value = '';
  submitBtn.disabled = true;

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg bot loading';
  loadingDiv.textContent = hasFile ? '申請書を確認中...' : '検索・回答生成中...';
  chat.appendChild(loadingDiv);
  scrollToBottom();

  try {
    if (hasFile) {
      const formData = new FormData();
      formData.append('file', pdfFile.files[0]);
      formData.append('note', question);
      const res = await fetch('/api/check-application', { method: 'POST', body: formData });
      if (res.status === 401) { loadingDiv.remove(); showLogin('セッションが切れました。再度サインインしてください。'); return; }
      const data = await res.json();
      loadingDiv.remove();
      addCheckMessage(data.result);
      pdfFile.value = '';
      fileChipRow.innerHTML = '';
    } else {
      const compareMode = document.getElementById('compareMode').checked;
      const endpoint = compareMode ? '/api/compare' : '/api/ask';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (res.status === 401) { loadingDiv.remove(); showLogin('セッションが切れました。再度サインインしてください。'); return; }
      const data = await res.json();
      loadingDiv.remove();
      if (compareMode) {
        addComparisonMessage(data);
      } else {
        addBotMessage(data.result);
      }
    }
  } catch (err) {
    loadingDiv.textContent = 'エラーが発生しました: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
