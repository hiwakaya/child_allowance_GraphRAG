# Phase0: 児童扶養手当 認定判定 判定木
# 本判定木はGraphRAGにおける推論経路提示のための構造であり、
# 行政判断の代替や金額計算を行うものではない（CLAUDE.md参照）。

decision_tree: 児童扶養手当_認定判定
version: "1.0"
source: 札幌市児童扶養手当事務処理マニュアル
revision: 令和8年4月改訂（国マニュアル反映後）
root: START

nodes:
  - id: START
    type: entry
    description: 認定請求の受付
    page: 12
    next: CHECK_CLAIMANT_TYPE

  - id: CHECK_CLAIMANT_TYPE
    type: decision
    ref: eligibility_rules.claimant_requirements
    description: 申請者の類型（母／父／養育者）と類型別要件（監護／生計同一／生計維持）を確認
    on_fail: DECISION_REJECT
    next: CHECK_POSITIVE_REQUIREMENTS

  - id: CHECK_POSITIVE_REQUIREMENTS
    type: decision
    ref: eligibility_rules.positive_requirements
    description: 児童が積極的要件（PR01〜PR08）のいずれかに該当するか（ANY）
    on_fail: DECISION_REJECT
    next: CHECK_NEGATIVE_REQUIREMENTS

  - id: CHECK_NEGATIVE_REQUIREMENTS
    type: decision
    ref: eligibility_rules.negative_requirements
    description: 児童が消極的要件（NR01〜NR04）のいずれにも該当しないか（NONE）
    on_fail: DECISION_REJECT
    next: CHECK_CHILD_AGE

  - id: CHECK_CHILD_AGE
    type: decision
    ref: eligibility_rules.child_requirements
    description: 児童が年齢要件（18歳到達年度末まで、又は20歳未満の障がい児）を満たすか
    on_fail: DECISION_REJECT
    next: CHECK_INCOME_LIMIT

  - id: CHECK_INCOME_LIMIT
    type: decision
    ref: benefit_rules.income_limit_determination
    description: 受給資格者・配偶者・扶養義務者の所得が所得制限限度額表のいずれの区分に該当するか
    page: 65
    next: DETERMINE_BENEFIT_CATEGORY

  - id: DETERMINE_BENEFIT_CATEGORY
    type: decision
    ref: benefit_rules.benefit_category_rules
    description: 所得区分に基づき全部支給／一部支給／全部停止を判定（BC01〜BC04）
    branches:
      - condition: 全部支給
        next: CHECK_PENSION
      - condition: 一部支給
        next: CHECK_PENSION
      - condition: 全部停止
        next: DECISION_FULL_STOP

  - id: CHECK_PENSION
    type: decision
    ref: benefit_rules.pension_coordination_rule
    description: 公的年金等の受給がある場合、年金額と手当額を比較し併給調整
    page: 71
    branches:
      - condition: 年金額 >= 手当額
        next: DECISION_FULL_STOP
      - condition: 年金額 < 手当額
        next: CHECK_FIVE_YEAR_RULE

  - id: CHECK_FIVE_YEAR_RULE
    type: decision
    ref: benefit_rules.five_year_half_reduction_rule
    description: 支給開始から5年等経過し適用除外事由に該当しない場合、2分の1支給停止（BC05）
    page: 54
    next: DECISION_APPROVE

  - id: DECISION_APPROVE
    type: decision_outcome
    event: 認定
    description: 支給要件を満たし、認定（受給権発生）。市長の認定により初めて手当を受ける権利が発生する。
    law_reference: 法第7条
    page: 5
    next: CHECK_ONGOING_OBLIGATIONS

  - id: DECISION_REJECT
    type: decision_outcome
    event: 却下
    description: 受給資格者要件不充足、積極的要件不充足、消極的要件該当、又は児童年齢要件不充足により却下

  - id: DECISION_FULL_STOP
    type: decision_outcome
    event: 全部停止
    description: 所得超過（法第9条第1項）又は年金額が手当額以上のため全部停止
    law_reference: 法第9条第1項

  # --- 受給後イベント（認定後のモニタリング〜差止・喪失・返還） ---

  - id: CHECK_ONGOING_OBLIGATIONS
    type: decision
    ref: benefit_rules.suspension_rule
    description: 認定後、届出義務（住所変更等）・現況届提出・法第29条命令への対応が継続して履行されているかを確認
    page: 94, 95, 97, 101
    branches:
      - condition: 届出義務違反（住所変更等の届出が期限内にされない、又は書類提出命令に従わない）
        next: DECISION_SUSPEND
      - condition: 現況届が2年間未提出のまま支払期日（時効完成日）を経過
        next: DECISION_LOSS_BY_PRESCRIPTION
      - condition: 法第29条命令違反・質問拒否・虚偽申請
        next: DECISION_DENIAL_ART14
      - condition: 義務履行継続
        next: CHECK_ONGOING_OBLIGATIONS

  - id: DECISION_SUSPEND
    type: decision_outcome
    event: 差止
    ref: benefit_rules.suspension_rule
    description: 正当な理由なく届出・書類提出をしないため、手当の支払を一時差し止める
    law_reference: [法第15条, 法第28条第1項]
    page: 97
    next: CHECK_SUSPENSION_RESOLUTION

  - id: CHECK_SUSPENSION_RESOLUTION
    type: decision
    description: 差止の解消状況を確認
    page: 97
    branches:
      - condition: 届出・書類提出により差止事由が解消
        next: DECISION_SUSPENSION_LIFT
      - condition: 現況届未提出のまま2年間解消しない
        next: DECISION_LOSS_BY_PRESCRIPTION

  - id: DECISION_SUSPENSION_LIFT
    type: decision_outcome
    event: 差止解除
    description: 届出・書類提出により差止事由が解消し、手当の支払を再開する
    page: 97

  - id: DECISION_LOSS_BY_PRESCRIPTION
    type: decision_outcome
    event: 資格喪失（時効）
    ref: benefit_rules.two_year_non_submission_loss_rule
    description: 現況届未提出のまま支払期日から2年が経過し、受給権が時効消滅したため職権により資格を喪失させる
    law_reference: 法第7条
    page: 95
    next: CHECK_OVERPAYMENT

  - id: DECISION_DENIAL_ART14
    type: decision_outcome
    event: 支給停止（法第14条）
    ref: benefit_rules.proper_receipt_rule
    description: 法第29条第1項の命令違反・質問拒否・虚偽申請により、手当額の全部又は一部を支給しないことを決定する
    law_reference: [法第14条, 法第29条第1項]
    page: 101
    next: CHECK_OVERPAYMENT

  - id: CHECK_OVERPAYMENT
    type: decision
    description: 資格喪失・支給停止決定が過去に遡及するため、既支払額に過支給（返還対象額）が生じるかを確認
    page: 98, 100
    branches:
      - condition: 手当の支給が継続しており今後の支払額から調整可能
        next: DECISION_PAYMENT_ADJUSTMENT
      - condition: 手当の支給が継続しておらず調整の対象となる次期支払がない
        next: DECISION_DEBT

  - id: DECISION_PAYMENT_ADJUSTMENT
    type: decision_outcome
    event: 支払調整
    ref: benefit_rules.payment_adjustment_rule
    description: 過支給分を次期以降支払われるべき手当の内払とみなし、支払額を減額調整する
    law_reference: 法第31条
    page: 100

  - id: DECISION_DEBT
    type: decision_outcome
    event: 債権発生（返還金）
    ref: benefit_rules.debt_repayment_rule
    description: 過支給分について返還通知が到達した時点で債権として確定し、返還を請求する
    law_reference: 法第31条
    page: 98

known_gaps:
  description: 原典（markdown/sapporo_jido_fuyo_teate_manual.md）は全40セクション・Q&Aまで取得済み。
    支給要件～所得制限・年金併給に加え、差止・資格喪失（時効）・支給停止（法第14条）・
    支払調整・債権（返還金）までを本ファイルでルール化済み（CHECK_ONGOING_OBLIGATIONS以降）。
  not_yet_modeled_sections:
    - name: 額改定（増額・減額の入力実務、資格喪失届の様式別分岐）
      page: 33, 37
      note: 認定後の異動事由（施設入所・住所変更・別居監護等）ごとの額改定分岐は未モデル化。増額改定/減額改定という区分自体はDECISION_APPROVE後の変動として今後CHECK_ONGOING_OBLIGATIONSに合流させる想定。
    - name: 通報時の対応
      page: 102
      note: 内部事務フローであり判定木としての分岐要素が薄いため意図的に未モデル化
    - name: JR通勤定期の特別割引制度
      page: 103
      note: 児童扶養手当の周辺制度（利用証明）であり支給要件・支給区分の判定には影響しないため対象外
  impact: PHASE6 EVENT GRAPH構築時は、上記の額改定分岐（特に施設入所・住所変更・別居監護・生計別等の異動事由ごとの取扱い）を追加でルール化する必要がある
