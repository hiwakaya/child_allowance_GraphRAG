<title>児童扶養手当ナレッジグラフ</title>
<style>
  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --surface-2: #e4e9e2;
    --ink: #16202b;
    --muted: #5b6672;
    --line: #c7cdc4;
    --accent: #b8382c;
    --accent-2: #96742a;
    --law-fill: #1f3a5f;
    --law-ink: #f3f6fb;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1620;
      --surface: #17212e;
      --surface-2: #1b2637;
      --ink: #eef1f6;
      --muted: #8b96a8;
      --line: #2b3850;
      --accent: #e2665a;
      --accent-2: #c9a54c;
      --law-fill: #35547e;
      --law-ink: #f3f6fb;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1620;
    --surface: #17212e;
    --surface-2: #1b2637;
    --ink: #eef1f6;
    --muted: #8b96a8;
    --line: #2b3850;
    --accent: #e2665a;
    --accent-2: #c9a54c;
    --law-fill: #35547e;
    --law-ink: #f3f6fb;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 28px 16px;
  }

  .slide {
    width: 100%;
    max-width: 1180px;
    aspect-ratio: 1600 / 900;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 34px 42px 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .stats {
    display: flex;
    gap: 22px;
  }
  .stat { text-align: right; }
  .stat .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .stat .l {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  figure { margin: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  svg { width: 100%; height: 100%; display: block; }
  figcaption {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 2px;
  }

  .node-title { font-weight: 700; font-size: 15px; }
  .node-count { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .rel-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; }
  .zone-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--muted); }

  .paths-box {
    font-family: var(--mono);
    font-size: 10.5px;
    fill: var(--muted);
  }
  .paths-box .step { fill: var(--ink); }
</style>

<div class="slide">
  <header>
    <div>
      <p class="eyebrow">CHILD ALLOWANCE GRAPHRAG — SCHEMA OVERVIEW (Rev. 2026-08-18)</p>
      <h1>児童扶養手当ナレッジグラフ</h1>
    </div>
    <div class="stats">
      <div class="stat"><div class="n">273</div><div class="l">NODES</div></div>
      <div class="stat"><div class="n">493</div><div class="l">RELATIONSHIPS</div></div>
      <div class="stat"><div class="n">9</div><div class="l">ONTOLOGY LABELS</div></div>
    </div>
  </header>

  <figure>

      <defs>
        <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)" />
        </marker>
        <marker id="arrow-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)" />
        </marker>
      </defs>

      <!-- grounding zone backdrop -->
      <rect x="140" y="655" width="1320" height="150" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-dasharray="3 4" />
      <text x="160" y="672" class="zone-label">grounding layer — 制度知識の根拠</text>

      <!-- ===== solid logic-flow arrows ===== -->
      <g stroke="var(--ink)" fill="none" stroke-width="1.6">
        <!-- Income -> Rule -->
        <path d="M1050,270 L905,338" marker-end="url(#arrow-ink)" />

        <path d="M800,338 L800,112" marker-end="url(#arrow-ink)" />
        <!-- Concept -> Eligibility (routed left of the Decision box) -->
        <path d="M240,680 L150,600 L150,320 L400,272" marker-end="url(#arrow-ink)" />
        <!-- Person -> Eligibility -->
        <path d="M240,222 L258,214" marker-end="url(#arrow-ink)" />
      </g>
      <g fill="var(--surface)">

        <rect x="380" y="368" width="118" height="16" />
        <rect x="560" y="452" width="98" height="16" />

        <rect x="185" y="185" width="70" height="15" />
      </g>
      <g class="rel-label" fill="var(--ink)">
        <text x="944" y="303" text-anchor="middle">APPLIES_TO</text>
        <text x="439" y="381" text-anchor="middle">SATISFIES / BLOCKS</text>
        <text x="609" y="465" text-anchor="middle">DETERMINES</text>
        <text x="800" y="465" text-anchor="middle">DETERMINES</text>
        <text x="800" y="551" text-anchor="middle">RESULTS_IN</text>

        <path d="M940,725 L1138,725" marker-end="url(#arrow-accent2)" />

      <g fill="var(--surface-2)">
        <rect x="530" y="628" width="98" height="15" />

      </g>

      <!-- Rule (ルール) -->

      </g>

      <!-- Event (イベント) -->
      <g>
        <rect x="1040" y="500" width="300" height="100" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4" />

        <text x="1190" y="550" text-anchor="middle" font-size="11" fill="var(--muted)">資格喪失・額改定・返還 等</text>

        <text x="800" y="708" text-anchor="middle" class="node-title" font-size="14" fill="var(--accent-2)">Chunk</text>
        <text x="800" y="726" text-anchor="middle" font-size="10.5" fill="var(--muted)">原典から抽出した根拠断片</text>

        <rect x="1140" y="680" width="280" height="90" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4" />
        <text x="1280" y="708" text-anchor="middle" class="node-title" font-size="14">Document</text>
        <text x="1280" y="726" text-anchor="middle" font-size="10.5" fill="var(--muted)">札幌市事務処理マニュアル</text>

      <!-- example reasoning paths callout, in the empty band between Law and the domain tier -->
      <g class="paths-box">

        <text x="60" y="147"><tspan class="step" fill="var(--ink)">当事者（母/父/養育者）</tspan> → 支給要件 → <tspan class="step" fill="var(--ink)">認定</tspan> → 受給権</text>

      </g>

    </svg>
    <figcaption>法令が全ラベルを規律し、当事者が支給要件へ、支給要件・所得がルールを介して判定・支給を生み、判定がイベントを生成する。全ノードは Chunk（原典根拠）と概念（用語定義）に接続し、回答の説明責任を担保する。</figcaption>
  </figure>
</div>
